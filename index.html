  <meta name="theme-color" content="#09060f" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#faf8fd" media="(prefers-color-scheme: light)" />
  <script>
    (function () {
      // Same order as ThemeContext: the stored choice, else the OS preference.
      // A browser that blocks site data throws on localStorage itself, and
      // that must not skip the OS check, or the first paint would be dark
      // and React would flip it to light a moment later.
      var stored = null;
      try { stored = window.localStorage.getItem("theme"); } catch (e) {}
      var theme = (stored === "light" || stored === "dark") ? stored : null;
      if (!theme) {
        try {
          theme = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        } catch (e) { theme = "dark"; }
      }
      document.documentElement.dataset.theme = theme;
    })();
  </script>
