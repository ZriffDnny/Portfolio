# Monthly dependency updates. npm minor and patch releases arrive together in
# one pull request; each major version gets its own, since those are the ones
# that need reading (see the peer-range note on .npmrc in CLAUDE.md). The
# Quality workflow runs on every one of them.
#
# A release is proposed only once it has been out for seven days (GitHub's
# default is three), because a hijacked package version is usually caught and
# pulled within that window. Security updates ignore the cooldown and still
# open at once.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
